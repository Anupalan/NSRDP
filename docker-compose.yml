# Local run of the GI Cloud deployment shape: database, one-off migration, API, worker.
# Credentials here are for local development only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nsrdp
      POSTGRES_PASSWORD: nsrdp-local-only
      POSTGRES_DB: nsrdp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsrdp"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &env
      NSRDP_DATABASE_URL: postgresql+psycopg://nsrdp:nsrdp-local-only@db:5432/nsrdp
      NSRDP_ENVIRONMENT: local
      NSRDP_AUTH_MODE: dev
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    environment: *env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build: .
    command: ["python", "-m", "nsrdp.connectors.worker"]
    environment: *env
    depends_on:
      migrate: {condition: service_completed_successfully}
