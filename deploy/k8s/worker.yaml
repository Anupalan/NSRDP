apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsrdp-worker
spec:
  replicas: 1                       # outbox uses SKIP LOCKED, so >1 is safe; TBC
  selector:
    matchLabels: {app.kubernetes.io/name: nsrdp-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nsrdp-worker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: nsrdp
          command: ["python", "-m", "nsrdp.connectors.worker"]
          envFrom: [{configMapRef: {name: nsrdp-config}}]
          env:
            - name: NSRDP_DATABASE_URL
              valueFrom: {secretKeyRef: {name: nsrdp-db, key: url}}
          resources:                # TBC: placeholders until load profile is known
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
