# Run before each rollout (e.g. as a pre-deploy step in the release pipeline).
apiVersion: batch/v1
kind: Job
metadata:
  name: nsrdp-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: nsrdp
          command: ["alembic", "upgrade", "head"]
          envFrom: [{configMapRef: {name: nsrdp-config}}]
          env:
            - name: NSRDP_DATABASE_URL
              valueFrom: {secretKeyRef: {name: nsrdp-db, key: url}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
